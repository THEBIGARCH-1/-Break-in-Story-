<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D House Search Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <div id="game-container">
        <div id="crosshair">+</div>

        <div id="interaction-prompt">Press <span class="key">E</span> to Interact</div>

        <div id="stamina-container">
            <div id="stamina-bar"></div>
        </div>

        <div id="tutorial-box">
            <h2 id="tut-title">3D HOUSE SEARCH</h2>
            <p id="tut-text"><b>CLICK ANYWHERE TO START</b><br><br>Talk to the Guide NPC in front of you using <b>E</b> to learn the controls!</p>
        </div>

        <div id="inventory-ui">Items Found: <span id="loot-count">0</span> / <span id="total-loot">4</span></div>
    </div>

</body>
</html>
