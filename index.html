<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Break-In Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <div id="game-container">
        <div id="crosshair">+</div>

        <div id="interaction-prompt">Press <span class="key">E</span> to Pick Up</div>

        <div id="stamina-container">
            <div id="stamina-bar"></div>
        </div>

        <div id="tutorial-box">
            <h2 id="tut-title">MISSION: HOUSE BREAK-IN</h2>
            <p id="tut-text"><b>CLICK ANYWHERE TO START</b><br><br><b>WASD</b> to Walk | <b>SHIFT</b> to Sprint | <b>E</b> to Pick Up Loot</p>
        </div>

        <div id="inventory-ui">Loot Collected: <span id="loot-count">0</span>/1</div>
    </div>

</body>
</html>
