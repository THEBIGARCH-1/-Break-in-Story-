<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dungeon & House Heist</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    
    <script src="script.js" defer></script>
</head>
<body>

    <div id="game-container">
        <div id="crosshair"></div>

        <div id="fade-overlay"></div>

        <div id="interaction-prompt">
            <span class="key">E</span> <span id="prompt-text">Interact</span>
        </div>

        <div id="stamina-container">
            <div id="stamina-label">STAMINA</div>
            <div id="stamina-bar-bg">
                <div id="stamina-bar"></div>
            </div>
        </div>

        <div id="dialogue-box">
            <div id="npc-header">
                <div id="npc-badge">👮</div>
                <div id="npc-name">POLICE OFFICER</div>
            </div>
            <p id="dialogue-text">Welcome recruit! Click anywhere on the screen to look around, then step up and talk to me.</p>
            <div id="dialogue-hint">Press <span class="key">E</span> to advance dialogue</div>
        </div>

        <div id="hotbar">
            <button class="slot" id="slot-sword" data-slot="1">
                <span class="slot-number">1</span>
                <div class="item-icon">⚔️</div>
                <span class="slot-label">Sword</span>
            </button>
            <button class="slot" id="slot-crate" data-slot="2">
                <span class="slot-number">2</span>
                <div class="item-icon">📦</div>
                <span class="slot-label">Crate</span>
            </button>
            <button class="slot" id="slot-phone" data-slot="3">
                <span class="slot-number">3</span>
                <div class="item-icon">📱</div>
                <span class="slot-label">Phone</span>
            </button>
        </div>
    </div>

</body>
</html>
